<style>
/* Layout: one inspection tag at a time, picked from a sticky row of item chips. Built for one hand at a curb. */
:root {
  --bg: #eef1f0;
  --card: #ffffff;
  --ink: #17232b;
  --muted: #5a6870;
  --line: #d3dbdc;
  --accent: #0f6b74;
  --accent-soft: #dcecee;
  --stop: #b4232c;
  --stop-soft: #fbe7e8;
  --done: #2f7d3a;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171b; --card: #19232a; --ink: #e6eef0; --muted: #9aabb2; --line: #2c3a42;
    --accent: #5cc3cc; --accent-soft: #173a40; --stop: #ff7a80; --stop-soft: #3a1c20; --done: #7fd18a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171b; --card: #19232a; --ink: #e6eef0; --muted: #9aabb2; --line: #2c3a42;
  --accent: #5cc3cc; --accent-soft: #173a40; --stop: #ff7a80; --stop-soft: #3a1c20; --done: #7fd18a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.45 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
header.top { padding-block: 18px 6px; }
h1 { font: 700 1.6rem/1.1 var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 0.9rem; }
nav.chips {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 10px;
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px));
}
nav.chips::-webkit-scrollbar { display: none; }
nav.chips a {
  flex: 0 0 auto; text-decoration: none; color: var(--ink);
  border: 1px solid var(--line); background: var(--card);
  padding: 7px 12px; border-radius: 999px; font-size: 0.88rem; font-weight: 500; white-space: nowrap;
}
nav.chips a[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); }
nav.chips a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tag {
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 18px 16px 16px; display: grid; gap: 16px; margin-top: 6px;
}
.tag-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tag-head h2 { font: 700 1.35rem/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.count { font: 500 0.85rem var(--font-mono); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count.all { color: var(--done); }
.lede { margin: -8px 0 0; color: var(--muted); font-size: 0.93rem; }
.stop { background: var(--stop-soft); border-radius: 10px; padding: 12px 14px; }
.stop h3, .section h3 {
  font: 600 0.75rem var(--font-body); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 6px;
}
.stop h3 { color: var(--stop); }
.stop ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.section h3 { color: var(--accent); }
.checks { list-style: none; margin: 0; padding: 0; display: grid; }
.checks li { border-top: 1px solid var(--line); }
.checks li:first-child { border-top: 0; }
.checks label { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; cursor: pointer; }
.checks input { width: 22px; height: 22px; margin: 1px 0 0; flex: 0 0 auto; accent-color: var(--accent); }
.checks span { min-width: 0; }
.checks input:checked + span { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.checks b { font-weight: 600; }
.how { display: block; color: var(--muted); font-size: 0.86rem; margin-top: 2px; }
.checks input:checked + span .how { text-decoration: none; }
.plain { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 12px; }
.foot small { color: var(--muted); }
button.reset {
  font: 500 0.88rem var(--font-body); color: var(--accent); background: var(--accent-soft);
  border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
.deal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.deal label { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); min-width: 0; }
.deal input {
  width: 100%; min-width: 0; font: 500 1rem var(--font-mono); padding: 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-variant-numeric: tabular-nums;
}
.readout { margin: 8px 0 0; font: 500 0.92rem var(--font-mono); font-variant-numeric: tabular-nums; }
.readout.good { color: var(--done); }
.readout.bad { color: var(--stop); }
.note { color: var(--muted); font-size: 0.82rem; margin-top: 18px; }
@media (prefers-reduced-motion: no-preference) { .tag { animation: in .18s ease-out; } @keyframes in { from { transform: translateY(4px); opacity: .6; } } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Pickup Inspection Cards</h1>
    <p class="sub">Open the card for what you're buying. Check it off before any money moves.</p>

const KEY = "pickup-cards-v1";
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const chips = document.getElementById("chips");
const host = document.getElementById("card");

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" })[c]); }

chips.innerHTML = CARDS.map(c => `<a href="#${c.id}" data-id="${c.id}">${esc(c.chip)}</a>`).join("");

function current() {
  const id = (location.hash || "").slice(1);
  return CARDS.find(c => c.id === id) || CARDS[0];
}

function dealReadout() {
  const d = state.deal || {};
  const ask = parseFloat(d.ask), p50 = parseFloat(d.p50), max = parseFloat(d.max);
  const out = [];
  let cls = "";
  if (ask > 0 && p50 > 0) {
    const pct = Math.round((1 - ask / p50) * 100);
    out.push(pct >= 0 ? `Ask is ${pct}% below p50` : `Ask is ${-pct}% above p50`);
    if (pct > 30) { out.push("clears the 30% steal bar"); cls = "good"; }
  }
  if (ask > 0 && max > 0 && ask > max) { out.push(`$${Math.round(ask - max)} over your walk-away`); cls = "bad"; }
  return { text: out.join(", ") || "Enter the ask and the used p50 to see the gap.", cls };
}

function render() {
  const c = current();
  chips.querySelectorAll("a").forEach(a => {
    const on = a.dataset.id === c.id;
    a.setAttribute("aria-current", on ? "true" : "false");
    if (on) a.scrollIntoView({ block: "nearest", inline: "center" });
  });
  const ticks = state[c.id] || {};
  const done = c.checks.filter((_, i) => ticks[i]).length;
  const r = c.deal ? dealReadout() : null;
  const d = state.deal || {};
  host.innerHTML = `
  <article class="tag" aria-labelledby="t-${c.id}">
    <div class="tag-head">
      <h2 id="t-${c.id}">${esc(c.title)}</h2>
      <span class="count ${done === c.checks.length ? "all" : ""}" id="count">${done}/${c.checks.length}</span>
    </div>
    <p class="lede">${esc(c.lede)}</p>
    ${c.bring ? `<section class="section"><h3>Bring</h3><ul class="plain">${c.bring.map(b => `<li>${esc(b)}</li>`).join("")}</ul></section>` : ""}
    <section class="stop"><h3>Walk away if</h3><ul>${c.stop.map(s => `<li>${esc(s)}</li>`).join("")}</ul></section>
    <section class="section"><h3>Check</h3>
      <ul class="checks">${c.checks.map(([t, how], i) => `
        <li><label for="ck-${c.id}-${i}"><input type="checkbox" id="ck-${c.id}-${i}" data-i="${i}" ${ticks[i] ? "checked" : ""}>
        <span><b>${esc(t)}</b><span class="how">${esc(how)}</span></span></label></li>`).join("")}
      </ul>
    </section>
    ${c.deal ? `<section class="section"><h3>Deal line</h3>
      <div class="deal">
        <label for="d-ask">Ask $<input id="d-ask" inputmode="decimal" data-k="ask" value="${esc(d.ask || "")}"></label>
        <label for="d-p50">Used p50 $<input id="d-p50" inputmode="decimal" data-k="p50" value="${esc(d.p50 || "")}"></label>
        <label for="d-max">Walk-away $<input id="d-max" inputmode="decimal" data-k="max" value="${esc(d.max || "")}"></label>
      </div>
      <p class="readout ${r.cls}" id="readout">${esc(r.text)}</p>
    </section>` : ""}
    <div class="foot"><small>${done === c.checks.length ? "All checked. OK to pay." : "Pay only when every box is ticked."}</small>
      <button class="reset" id="reset" type="button">Clear this card</button></div>
  </article>`;
}

host.addEventListener("change", e => {
  const el = e.target;
  if (el.matches(".checks input")) {
    const c = current();
    state[c.id] = state[c.id] || {};
    state[c.id][el.dataset.i] = el.checked;
    save(); render();
    const again = document.getElementById(el.id); if (again) again.focus();
  }
});
host.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.k) {
    state.deal = state.deal || {};
    state.deal[el.dataset.k] = el.value.replace(/[^0-9.]/g, "");
    save();
    const r = dealReadout(), o = document.getElementById("readout");
    o.textContent = r.text; o.className = "readout " + r.cls;
  }
});
host.addEventListener("click", e => {
  if (e.target.id === "reset") {
    const c = current();
    delete state[c.id];
    if (c.deal) delete state.deal;
    save(); render();
  }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
render();
</script>

</body>
</html>
